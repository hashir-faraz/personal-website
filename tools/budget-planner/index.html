    var ri=+t.getAttribute('data-rmsn');
    st.names.splice(ri,1); st.nameIds.splice(ri,1); svcLines(); return;
  }
  if(e.target.closest('#q-add')){
    st.names.push(''); st.nameIds.push(null); svcLines();
    var ins=document.querySelectorAll('#q-svc input'); if(ins.length) ins[ins.length-1].focus(); return;
  }
  if((t=e.target.closest('[data-eg]'))){
    var nm=t.getAttribute('data-eg'), at=-1, blank=-1;
    st.names.forEach(function(x,i){
      if(x.trim().toLowerCase()===nm.toLowerCase()) at=i;
      if(blank<0 && !x.trim()) blank=i;
    });
    if(at>=0){ st.names.splice(at,1); st.nameIds.splice(at,1); }
    else if(blank>=0){ st.names[blank]=nm; }
    else { st.names.push(nm); st.nameIds.push(null); }
    if(!st.names.length){ st.names=['']; st.nameIds=[null]; }
    svcLines(); return;
  }
  if(e.target.closest('#q-go')){
    /* keep the id alongside the name so coming back through Setup renames and reorders
       the services someone already has, instead of throwing their numbers away */
    var picked=[];
    st.names.forEach(function(n,i){ if(n.trim()) picked.push({n:n.trim(), id:st.nameIds[i]}); });
    var biz=document.getElementById('q-biz').value.trim();
    if(!picked.length || !biz) return;
    if(st.built){
      var by={}; st.svc.forEach(function(s){ by[s.id]=s; });
      st.biz=biz;
      st.svc=picked.map(function(p){
        var old = p.id && by[p.id];
        if(old){ old.name=p.n; return old; }
        return {id:uid(), name:p.n, price:S(0), qty:S(0)};
      });
      st.names=picked.map(function(p){ return p.n; });
      st.nameIds=st.svc.map(function(s){ return s.id; });

      save(); setStage('plan'); setView('build');

      setPID(null);   /* a brand-new plan never inherits an old link */
      st=build(biz, st.cur, st.sm, st.sy, picked.map(function(p){ return p.n; }));
      st.nameIds=st.svc.map(function(s){ return s.id; });
      st.openBlk={s0:true};
      save(); setStage('plan'); setView('build');
      /* the plan gets its own link the moment it exists */
      cloudSave();
    }
  }
});

main.addEventListener('input',function(e){
  var t=e.target, s, v;

  /* starting amount / monthly change */
  if(t.matches('.nfb input')){
    var path=t.getAttribute('data-p'), which=t.getAttribute('data-num');
    s=getSeries(path);
    v=num(t.value);

      if(s.sm && path==='s|0|price') firstPriceTyped();
      s.sm=false;

      s.b = v===null ? 0 : v;
      delete s.ov[0];
      if(coachStep===1 && t.value.trim()) coachShow(2);
    } else {
      /* the sign is simply the number's own: a minus in front makes it a decrease */
      s.r = v===null ? 0 : v;
    }
    paintRow(path, t); repaint(); save(); return;
  }

  /* a single month typed by hand */
  if(t.matches('.mc input')){
    var mc=t.closest('.mc'), p2=mc.getAttribute('data-k'), m=+mc.getAttribute('data-m');
    s=getSeries(p2);
    v=num(t.value);
    if(s.sm && p2==='s|0|price') firstPriceTyped();

      if(sf){ sf.value = s.b?fmt(s.b):''; var nf2=sf.closest('.nf'); nf2.classList.remove('sampled'); sf.placeholder='0'; }
    } else {
      if(v===null) delete s.ov[m]; else s.ov[m]=v;
    }

    else st.cat[+a[1]].roles[+a[2]].name=t.value;

  }
});

/* ═══════════ clicks on the plan ═══════════ */
document.addEventListener('click',function(e){
  var t;

  if((t=e.target.closest('.nfb')) && !e.target.closest('button,input')){
    var nfi=t.querySelector('input'); if(nfi) nfi.focus();
  }
  if((t=e.target.closest('[data-undo]'))){
    var mc=t.closest('.mc'), p=mc.getAttribute('data-k'), m=+mc.getAttribute('data-m');
    delete getSeries(p).ov[m];
    hideTT();
    rerenderRow(p); repaint(); save(); return;
  }
  if((t=e.target.closest('[data-step]'))){
    var sp=t.getAttribute('data-p'), ss=getSeries(sp), dd=+t.getAttribute('data-step');
    ss.r=Math.round(((ss.r||0)+dd)*100)/100;
    paintRow(sp); repaint(); save();
    return;
  }
  if((t=e.target.closest('.mb[data-mode]'))){
    var pp=t.getAttribute('data-p'), s=getSeries(pp), mode=t.getAttribute('data-mode');
    if(s.m===mode) return;
    if(mode==='custom'){ toCustom(s); }
    else {
      /* leaving the twelve-month table: the first month becomes the starting figure again */
      if(s.m==='custom'){ var v0=run(s); s.b=v0[0]; s.ov={}; }
      s.m=mode;
      /* a sensible first step: 5% a month, or +1 a month on a headcount, +1,000 on money */
      if(mode!=='flat' && !s.r) s.r = mode==='pct' ? 5 : (isCount(pp) ? 1 : 1000);
    }
    rerenderRow(pp); repaint(); save();
    var f=document.querySelector('.vrow[data-row="'+pp+'"] input[data-num="r"]');
    if(f){ f.focus(); try{ f.select(); }catch(err){} }
    if(coachStep===2) coachShow(3); else coachPos();
    return;
  }
  if((t=e.target.closest('[data-togg]'))){
    var k=t.getAttribute('data-togg'), was=!!st.openBlk[k];
    /* one at a time: with several open the editor turns into a very long scroll and the
       thing you just opened is nowhere near the sheet it changes */
    st.openBlk={};
    if(!was) st.openBlk[k]=true;
    save(); renderEditor(); coachPos();
    if(!was){
      var blk=document.querySelector('.blk[data-blk="'+k+'"]');
      if(blk) blk.scrollIntoView({block:'nearest',behavior:'smooth'});
    }
    return;
  }
  if((t=e.target.closest('[data-del]'))){
    var a=t.getAttribute('data-del').split('|');
    if(a[0]==='c') st.cat[+a[1]].items.splice(+a[2],1);
    else st.cat[+a[1]].roles.splice(+a[2],1);
    hideTT(); save(); renderEditor(); repaint(); return;
  }
  if((t=e.target.closest('[data-delsvc]'))){
    var di=+t.getAttribute('data-delsvc'), dsv=st.svc[di];
    if(!dsv) return;
    if((!dsv.price.sm || !dsv.qty.sm) && !confirm(tl('Remove this service and its numbers?'))) return;
    st.svc.splice(di,1);
    st.openBlk={}; for(var ok in openRows){ if(/^s\|/.test(ok)) delete openRows[ok]; }
    hideTT(); save(); renderEditor(); repaint(); return;
  }
  if(e.target.closest('[data-addsvc]')){
    st.svc.push({id:uid(), name:tl('New service'), price:S(0), qty:S(0)});
    var si=st.svc.length-1;
    st.openBlk['s'+si]=true;
    save(); renderEditor(); repaint();
    var nf=document.querySelector('[data-svcname="'+si+'"]');
    if(nf){ nf.focus(); nf.select(); nf.scrollIntoView({block:'center',behavior:'smooth'}); }
    return;
  }
  if((t=e.target.closest('[data-addcost]'))){ openAdd(t, +t.getAttribute('data-addcost'), 'cost'); return; }
  if((t=e.target.closest('[data-addrole]'))){ openAdd(t, +t.getAttribute('data-addrole'), 'role'); return; }
  if((t=e.target.closest('#seg button'))){ setView(t.getAttribute('data-view')); return; }

  if((t=e.target.closest('[data-act]'))){
    var act=t.getAttribute('data-act');
    if(act==='reset'){
      if(confirm(tl('Clear everything and start from scratch?'))){
        try{ localStorage.removeItem(KEY); }catch(err){}
        /* the old plan stays on its link for anyone who has it; this starts a new one */
        clearTimeout(cloudT); cloudDirty=false; setPID(null); setSaved('');
        try{ history.replaceState(null,'',location.pathname+(AR?'?lang=ar':'')); }catch(err){}
        fixLangLink();
        st=fresh(); openRows={}; initStart(); setStage('start'); toast(tl('Cleared'));
      }
    }
    else if(act==='mlab'){ st.mlabels = st.mlabels===false; press(t, st.mlabels!==false);
      save(); syncSettings(); renderPlan(); }
    else if(act==='detail'){ detail=!detail; press(t,detail); repaint(); }
    else if(act==='thou'){ thou=!thou; press(t,thou); repaint(); }
    else if(act==='share'){ doShare(t); }
    else if(act==='csv'){ exportCSV(); }
    else if(act==='print-sheet'){ printOne('v-sheet','fit-sheet'); }
    else if(act==='print-dash'){ printOne('v-dash','fit-dash'); }
    /* a browser cannot write a PDF on its own: Save as PDF is the print dialog with the
       destination set to a file, so both buttons open the same dialog and this one says so */
    else if(act==='pdf-sheet'){ savePDF('v-sheet','fit-sheet'); }
    else if(act==='pdf-dash'){ savePDF('v-dash','fit-dash'); }
    return;
  }
  if((t=e.target.closest('[data-dtab]'))){ setDashTab(t.getAttribute('data-dtab')); return; }
  if(e.target.closest('#btn-setup')){
    st.names = st.svc.map(function(s){ return s.name; });
    st.nameIds = st.svc.map(function(s){ return s.id; });
    initStart(); setStage('start');
    return;
  }
  if(!e.target.closest('#menu') && !e.target.closest('[data-addcost]') && !e.target.closest('[data-addrole]')) closeMenu();
});

/* re-render exactly one value row (mode change, undo) without rebuilding the editor */
function rerenderRow(path){
  var row=document.querySelector('.vrow[data-row="'+path+'"]'); if(!row) return;
  row.outerHTML = rowHTML(path);
}

/* ═══════════ add menu ═══════════ */
var menu=document.getElementById('menu');
function openAdd(btn, ci, kind){
  var cat=st.cat[ci], used={}, list, title;
  if(kind==='role'){ list=ROLES.map(tl); title=tl('Common positions'); cat.roles.forEach(function(r){ used[r.name.toLowerCase()]=1; }); }
  else { list=(SUGGEST[cat.id]||SUGGEST.other).map(tl); title=tl('Common in')+' '+cat.name; cat.items.forEach(function(i){ used[i.name.toLowerCase()]=1; }); }
  var h='<div class="mh">'+esc(title)+'</div>', any=false;
  list.forEach(function(n){ if(used[n.toLowerCase()]) return; any=true; h+='<button data-pick="'+esc(n)+'">'+esc(n)+'</button>'; });
  if(!any) h+='<button disabled style="color:var(--ink-4);cursor:default">'+esc(tl('All added'))+'</button>';
  h+='<div class="sep"></div><button data-pick="__custom">'+esc(tl('Something else…'))+'</button>';
  menu.innerHTML=h; menu.classList.add('on');
  menu.setAttribute('data-ci',ci); menu.setAttribute('data-kind',kind);
  var r=btn.getBoundingClientRect();
  var y=r.bottom+6; if(y+menu.offsetHeight>innerHeight-10) y=Math.max(10, r.top-menu.offsetHeight-6);
  menu.style.left=Math.max(10, Math.min(r.left, innerWidth-menu.offsetWidth-10))+'px';
  menu.style.top=y+'px';
}
function closeMenu(){ menu.classList.remove('on'); }
menu.addEventListener('click',function(e){
  var b=e.target.closest('[data-pick]'); if(!b) return;
  var ci=+menu.getAttribute('data-ci'), kind=menu.getAttribute('data-kind'), n=b.getAttribute('data-pick');
  var custom = n==='__custom';
  if(custom) n = kind==='role' ? tl('New position') : tl('New cost');
  if(kind==='role') st.cat[ci].roles.push(role(n,0,1,false));
  else st.cat[ci].items.push(it(n,0));
  closeMenu(); save(); renderEditor(); repaint();
  var rows=document.querySelectorAll('.blk[data-blk="c'+ci+'"] .vrow');
  if(!rows.length) return;
  var target = kind==='role' ? rows[rows.length-2] : rows[rows.length-1];
  if(!target) target = rows[rows.length-1];
  /* a line the user named themselves opens with the name selected, a suggested one
     with the cursor already in the amount */
  var f = custom ? target.querySelector('[data-rename]') : target.querySelector('input[data-num="b"]');
  if(f){ f.focus(); try{ f.select(); }catch(err){} f.scrollIntoView({block:'center',behavior:'smooth'}); }
});

/* ═══════════ share ═══════════ */
/* the whole plan is squeezed into the link itself, so sharing needs no account and no
   server: whoever opens it gets the figures, and can carry on editing their own copy */
function packS(x){
  var o=[Math.round(x.b*100)/100, x.m==='pct'?1:(x.m==='amt'?2:(x.m==='custom'?3:0)), (x.r||0)], ov=[];
  for(var k in x.ov){ if(x.ov.hasOwnProperty(k)) ov.push([+k, x.ov[k]]); }
  if(ov.length) o.push(ov);
  return o;
}
function unpackS(a){
  a=a||[];
  var r0=a[2]===-0.0001?0:(a[2]||0);
  var x=S(a[0]||0, a[1]===1?'pct':(a[1]===2?'amt':(a[1]===3?'custom':'flat')), r0, false);
  (a[3]||[]).forEach(function(p){ x.ov[p[0]]=p[1]; });
  return x;
}
function packState(){
  return { v:1, b:st.biz, c:st.cur, m:st.sm, y:st.sy, l:st.mlabels===false?0:1, g:st.lang||LANG,
    s: st.svc.map(function(x){ return [x.name, packS(x.price), packS(x.qty)]; }),
    k: st.cat.map(function(cat){
      return cat.team
        ? [cat.id, cat.name, 2, cat.roles.map(function(r){ return [r.name, packS(r.pay), packS(r.n)]; })]
        : [cat.id, cat.name, cat.cogs?1:0, cat.items.map(function(i){ return [i.name, packS(i.s)]; })];
    }) };
}
function unpackState(o){
  var x={ biz:o.b||'', cur:o.c||'QAR', sm:o.m||0, sy:o.y||((new Date()).getFullYear()+1),
          mlabels:o.l!==0, built:true, lang:o.g||'en', openBlk:{}, svc:[], cat:[] };
  (o.s||[]).forEach(function(a){ x.svc.push({id:uid(), name:a[0]||'Service', price:unpackS(a[1]), qty:unpackS(a[2])}); });
  (o.k||[]).forEach(function(a){
    if(a[2]===2) x.cat.push({id:a[0], name:a[1], team:true, open:false,
      roles:(a[3]||[]).map(function(r){ return {id:uid(), name:r[0], pay:unpackS(r[1]), n:unpackS(r[2])}; })});
    else x.cat.push({id:a[0], name:a[1], cogs:a[2]===1, open:false,
      items:(a[3]||[]).map(function(i){ return {id:uid(), name:i[0], s:unpackS(i[1])}; })});
  });
  if(!x.svc.length || !x.cat.length) return null;
  x.names=x.svc.map(function(y){ return y.name; });
  x.nameIds=x.svc.map(function(y){ return y.id; });
  return x;
}
function b64e(str){ return btoa(unescape(encodeURIComponent(str))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function b64d(str){
  str=str.replace(/-/g,'+').replace(/_/g,'/');
  while(str.length%4) str+='=';
  return decodeURIComponent(escape(atob(str)));
}
function shareURL(){
  return location.origin+location.pathname+'#p='+b64e(JSON.stringify(packState()));
}
function shareDone(btn){
  if(!btn || !btn.lastChild){ toast(tl('Link copied')); return; }
  var tx=btn.lastChild;
  if(btn.getAttribute('data-l0')===null) btn.setAttribute('data-l0', tx.nodeValue);
  btn.classList.add('done'); tx.nodeValue=tl('Link copied');
  clearTimeout(btn._t);
  btn._t=setTimeout(function(){ btn.classList.remove('done'); tx.nodeValue=btn.getAttribute('data-l0'); },2400);
}
function doShare(btn){
  var u;
  if(PID){
    u=planURL(PID);
    /* push any edit still waiting, and count the click with the language of the button used */
    if(cloudDirty) cloudSave();
    rpc('track_share',{ p_id:PID, p_lang:LANG }).catch(function(){});
  } else {
    /* the plan never reached the server (offline, say): fall back to the self-contained link */
    try{ u=shareURL(); }catch(e){ toast(tl('Could not build the link')); return; }
  }
  var ok=function(){ shareDone(btn); };
  if(navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(u).then(ok, function(){ prompt(tl('Copy this link'), u); });
  else prompt(tl('Copy this link'), u);
  if(window.gtag) gtag('event','share',{tool:'budget_planner'});
}

/* ═══════════ export / print ═══════════ */
function exportCSV(){
  var c=calc(), rows=[], head=[''].concat(M.map(function(_,m){ return mlab(m); })).concat(['Year']);
  function line(name, vals, tot){ rows.push([name].concat(vals.map(round)).concat([round(tot===undefined?sum(vals):tot)])); }
  var neg=function(v){ return -v; };
  rows.push([ (st.biz||'Your business')+' — budget '+mfull(0)+' to '+mfull(11)+' ('+st.cur+')' ]);
  rows.push([]); rows.push(head);
  rows.push(['REVENUE']);
  c.svc.forEach(function(d){ line(d.ref.name, d.rev); });
  line('Total revenue', c.rev);
  rows.push([]);
  rows.push(['COSTS']);
  c.cat.forEach(function(d){
    if(!sum(d.v)) return;
    line(d.ref.name, d.v.map(neg));
    d.items.forEach(function(i){ if(sum(i.v)) line('   '+i.ref.name, i.v.map(neg)); });
  });
  line('Total costs', c.opex.map(neg));
  rows.push([]);
  line('NET PROFIT', c.net);
  line('Profit to date', c.cum, c.cum[11]);
  var csv=rows.map(function(r){ return r.map(function(cell){
    var s=String(cell===undefined?'':cell);
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(','); }).join('\n');
  var blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=((st.biz||'budget').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'budget')+'-12-month-budget.csv';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },400);
  toast(tl('Spreadsheet downloaded'));
}
/* ═══════════ Save as PDF: a real file, not the print dialog ═══════════
   Each page is drawn to an image off-screen and placed on an A4 landscape sheet. The two small
   libraries that do it load the first time somebody asks for a PDF, not before. */
var H2C='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
var JSPDF='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
var pdfLibs=null;
function loadScript(src){
  return new Promise(function(res,rej){
    var el=document.createElement('script'); el.src=src; el.onload=res; el.onerror=function(){ rej(new Error(src)); };
    document.head.appendChild(el);
  });
}
function pdfReady(){
  if(window.html2canvas && window.jspdf) return Promise.resolve();
  if(!pdfLibs) pdfLibs=Promise.all([ window.html2canvas?0:loadScript(H2C), window.jspdf?0:loadScript(JSPDF) ]);
  return pdfLibs.catch(function(e){ pdfLibs=null; throw e; });
}
function makePDF(viewId){
  return pdfReady().then(function(){
    var host=document.createElement('div'); host.className='pdfhost'; document.body.appendChild(host);
    var nodes=[];
    if(viewId==='v-sheet'){
      var c1=document.getElementById('sheet').cloneNode(true); c1.removeAttribute('id'); host.appendChild(c1); nodes.push(c1);
    } else {
      [].forEach.call(document.querySelectorAll('#dash .dpane'),function(p){
        var c=p.cloneNode(true); c.classList.add('on'); host.appendChild(c); nodes.push(c);
      });
    }
    var doc=new window.jspdf.jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
    var chain=Promise.resolve();
    nodes.forEach(function(n,i){
      chain=chain.then(function(){
        return window.html2canvas(n,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false}).then(function(cv){
          var W=297,H=210,M=8, r=Math.min((W-2*M)/cv.width,(H-2*M)/cv.height), w=cv.width*r, h=cv.height*r;
          if(i>0) doc.addPage();
          doc.addImage(cv.toDataURL('image/jpeg',0.92),'JPEG',(W-w)/2,M,w,h);
        });
      });
    });
    return chain.then(function(){ host.remove(); return doc; }, function(e){ host.remove(); throw e; });
  });
}
function savePDF(viewId, boxId){
  toast(tl('Preparing your PDF…'));
  makePDF(viewId).then(function(doc){
    doc.save(tl('Financial Plan')+' - '+bizName()+'.pdf');
    toast(tl('PDF downloaded'));
  }).catch(function(){
    /* no connection to fetch the two libraries, say: the print dialog still gets the file out */
    toast(tl('Pick Save as PDF in the dialog')); printOne(viewId, boxId);
  });
}
function printOne(viewId, boxId){
  /* only the section being printed is shown; the fit scaling is lifted for the printer
     and put back afterwards, so the page on screen does not end up stretched */
  var el=document.getElementById(viewId), box=document.getElementById(boxId);
  var inner=box.firstElementChild, keepT=inner.style.transform, keepH=box.style.height;
  var keepO=inner.style.transformOrigin, keepM=inner.style.marginLeft;
  /* every browser names the saved PDF after the document title */
  var keepTitle=document.title;
  document.title = tl('Financial Plan')+' - '+bizName();
  coachHide();
  var keepW=inner.style.width;
  el.classList.add('printing');
  inner.style.transform='none'; box.style.height='auto';
  /* A4 landscape at 96dpi less the 9mm @page margin, in CSS pixels. Three per cent is
     taken off the fit: print rounding differs between browsers and one stray pixel is a
     whole second page. */
  var PW=1054, PH=725;
  /* the sheet is measured at the width it will actually print at */
  if(viewId==='v-sheet') inner.style.width=PW+'px';
  var panes=null, paneStyles=null;
  if(viewId==='v-dash'){
    /* the dashboard prints as three pages, one per tab, each fitted to its own page */
    inner.classList.add('allpanes'); inner.style.width='1120px';
    panes=[].slice.call(inner.querySelectorAll('.dpane'));
    paneStyles=panes.map(function(p){ return p.getAttribute('style'); });
    panes.forEach(function(p){
      var pw=p.offsetWidth, ph=p.offsetHeight, pk=Math.min(PW/pw, PH/ph, 1)*0.97;
      p.style.transformOrigin='top left'; p.style.transform='scale('+pk+')';
      p.style.height=Math.ceil(ph*pk)+'px'; p.style.width=pw+'px';
      p.style.marginLeft=Math.max(0,(PW-pw*pk)/2)+'px'; p.style.marginRight=(-(pw-pw*pk))+'px';
    });
  }
  var w=inner.offsetWidth, h=inner.offsetHeight;
  var k=Math.min(PW/w, PH/h, 1)*0.97;
  if(viewId!=='v-dash' && k<0.999){
    inner.style.transformOrigin='top left';
    inner.style.transform='scale('+k+')';
    box.style.height=Math.ceil(h*k)+'px';
    /* scaling from the left corner leaves the page lopsided, so centre what is left */
    inner.style.marginLeft=Math.max(0,(PW-w*k)/2)+'px';
  }
  var restored=false;
  var done=function(){
    if(restored) return; restored=true;
    el.classList.remove('printing');
    if(panes){ inner.classList.remove('allpanes');
      panes.forEach(function(p,i){ if(paneStyles[i]===null) p.removeAttribute('style'); else p.setAttribute('style',paneStyles[i]); }); }
    document.title=keepTitle;
    inner.style.width=keepW;
    inner.style.transform=keepT; box.style.height=keepH;
    inner.style.transformOrigin=keepO; inner.style.marginLeft=keepM;
    fitAll();
  };
  if(window.matchMedia){
    var mq=window.matchMedia('print');
    var fn=function(m){ if(!m.matches){ done(); if(mq.removeEventListener) mq.removeEventListener('change',fn); } };
    if(mq.addEventListener) mq.addEventListener('change',fn);
  }
  setTimeout(function(){ window.print(); setTimeout(done,700); },60);
}

/* ═══════════ the furniture ═══════════ */
/* the parts of the page that are written in the HTML rather than built by the code.
   Each one keeps its icon; only the words beside it change. */

  q('#btn-reset').setAttribute('data-tt', tl('Clear this plan and start from the beginning'));
  q('[data-act="share"]').setAttribute('data-tt', tl('Copy a link your team can open and edit'));
  q('[data-act="mlab"]').setAttribute('data-tt', tl('Turn this off to label the columns M1 to M12 instead of real months'));
}

/* ═══════════ boot ═══════════ */
localiseChrome();
initSettings();
/* a plan arriving in the link opens as it was shared, without touching the one saved here
   until the first edit */
var shared=null;
if(location.hash.indexOf('#p=')===0){
  try{ shared=unpackState(JSON.parse(b64d(location.hash.slice(3)))); }catch(e){ shared=null; }
}
var linkId=urlPID();
st = shared || load();
fixLangLink();
if(linkId && !shared){
  /* a plan link: fetch that plan and carry on from where it was left */
  document.body.classList.add('booting');
  st=fresh();
  rpc('get_plan',{ p_id:linkId }).then(function(r){
    var s = r && r.data ? unpackState(r.data) : null;
    if(!s) throw new Error('missing');
    /* an Arabic plan opened with no language chosen yet opens in Arabic */
    var chose=true; try{ chose = localStorage.getItem(LKEY)!==null; }catch(e){}
    if(r.lang==='ar' && !AR && !chose && !/[?&]lang=/.test(location.search)){
      location.replace(location.pathname+'?'+(LOCAL?'plan='+linkId+'&':'')+'lang=ar'); return;
    }
    setPID(r.id);
    st=s; st.openBlk={};
    if(st.lang!==LANG){ remapNames(LANG); st.lang=LANG; }
    document.body.classList.remove('booting');
    initStart(); setStage('plan'); setView('build'); syncURL();
    save(true);
  }).catch(function(){
    document.body.classList.remove('booting');
    st = load() || fresh();
    if(st.built){ initStart(); setStage('plan'); setView('build'); }
    else { initStart(); setStage('start'); }
    toast(tl('That plan link was not found'));
  });
} else if(shared){
  /* an old self-contained link: it opens as shared and gets its own page link on the first edit */
  setPID(null);
  st.openBlk={};
  if(st.lang!==LANG){ remapNames(LANG); st.lang=LANG; }
  initStart();
  setStage('plan'); setView('build');
  try{ history.replaceState(null,'',location.pathname); }catch(e){}
  save(true);
  toast(tl('Plan opened'));
} else if(st){
  /* a returning visitor on the tool's own address carries on with their own plan link */
  if(PID) syncURL();
  if(!st.openBlk) st.openBlk={};
  /* built in the other language, opened in this one. A plan saved before the tool spoke
     two languages has no stamp at all, so it is remapped too - harmlessly, since a name
     that is not one of ours is never found in the table. */
  if(st.lang!==LANG) remapNames(LANG);
  st.lang=LANG;
  if(!st.names) st.names = st.svc.map(function(s){ return s.name; });
  st.nameIds = st.svc.map(function(s){ return s.id; });
  initStart();
  setStage('plan'); setView('build');
} else {
  st = fresh();
  initStart();
  setStage('start');
}

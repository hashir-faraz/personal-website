<!doctype html>
<meta charset="utf-8">
<title>Preview pictures</title>
<!-- Draws the four link-preview pictures (what WhatsApp, Slack, LinkedIn show when a link is pasted):
       tool-en, tool-ar   the planner page itself
       plan-en, plan-ar   any shared plan (the company name goes in the link's title instead)
     It uses the browser's own text engine, which joins and orders Arabic correctly.
     To remake them: run receive.py, open this page from the local site (see receive.py), and wait
     for "done". The pictures are saved to /assets/previews. Edit the strings and numbers below to
     change the design. -->
<body style="margin:0;background:#222;color:#ccc;font:14px sans-serif">
<p style="padding:8px">Rendering…</p>
<canvas id="c" width="1200" height="630" style="display:none"></canvas>
<div id="out"></div>
<script>
const W = 1200, H = 630;
const INDIGO = '#3533CD', DEEP = '#28279B', INK = '#101014', GREY = '#85858F', LINE = '#E7E6E1', GREEN = '#0A8754', RED = '#C8374B';
const SOFT = '#8A8A96';

const S = {
  en: {
    toolTitle: ['12-Month', 'Budget', 'Planner'], planTitle: ['12-Month', 'Financial Plan'],
    toolSub: 'Revenue, costs and profit by month', built: 'Built with',
    yearOne: 'YEAR 1', tag: 'EXAMPLE · QAR', revenue: 'REVENUE', costs: 'COSTS', net: 'NET PROFIT', year: 'YEAR',
    secRev: 'Revenue', totRev: 'Total revenue', secCost: 'Costs', totCost: 'Total costs', netRow: 'Net profit',
    months: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'],
    rev: ['Retainers', 'Projects', 'Consulting'], cost: ['Team', 'Workspace', 'Marketing', 'Admin']
  },
  ar: {
    toolTitle: ['مخطّط الميزانية', 'لسنة كاملة'], planTitle: ['الخطة المالية', 'لسنة كاملة'],
    toolSub: 'الإيرادات والتكاليف والأرباح شهرًا بشهر', built: 'مبني بواسطة',
    yearOne: 'السنة الأولى', tag: 'مثال · QAR', revenue: 'الإيراد', costs: 'التكاليف', net: 'صافي الربح', year: 'السنة',
    secRev: 'الإيراد', totRev: 'إجمالي الإيراد', secCost: 'التكاليف', totCost: 'إجمالي التكاليف', netRow: 'صافي الربح',
    months: ['ينا', 'فبر', 'مار', 'أبر', 'ماي', 'يون', 'يول', 'أغس', 'سبت', 'أكت', 'نوف', 'ديس'],
    rev: ['عقود شهرية', 'مشاريع', 'استشارات'], cost: ['الفريق', 'المكتب', 'التسويق', 'الإدارة']
  }
};

/* an example year: a slow start that turns profitable */
const R = [60000, 68000, 76000, 86000, 96000, 108000, 120000, 132000, 146000, 160000, 174000, 190000];
const X = [78000, 78000, 80000, 82000, 84000, 88000, 92000, 96000, 100000, 104000, 108000, 112000];
const N = R.map((v, i) => v - X[i]);
const part = (a, f) => a.map((v) => Math.round(v * f));
const rest = (a, ...o) => a.map((v, i) => v - o.reduce((s, x) => s + x[i], 0));
const R1 = part(R, 0.6), R2 = part(R, 0.3), R3 = rest(R, R1, R2);
const X1 = part(X, 0.55), X2 = part(X, 0.15), X3 = part(X, 0.2), X4 = rest(X, X1, X2, X3);
const total = (a) => a.reduce((p, q) => p + q, 0);
function compact(n) {
  const a = Math.abs(n);
  if (a >= 1e6) return (a / 1e6).toFixed(a >= 1e7 ? 0 : 1).replace(/\.0$/, '') + 'M';
  if (a >= 1e3) return (a / 1e3).toFixed(a >= 1e4 ? 0 : 1).replace(/\.0$/, '') + 'K';
  return String(Math.round(a));
}
const signed = (n) => (n < 0 ? '-' : '') + compact(n);

let logoImg;
async function loadAssets() {
  const faces = [
    ['Manrope', '/assets/fonts/Manrope-500.ttf', '500'], ['Manrope', '/assets/fonts/Manrope-800.ttf', '800'],
    ['Cairo', '/assets/fonts/Cairo-500.ttf', '500'], ['Cairo', '/assets/fonts/Cairo-700.ttf', '700']
  ];
  for (const [fam, url, w] of faces) {
    const f = new FontFace(fam, 'url(' + url + ')', { weight: w });
    await f.load(); document.fonts.add(f);
  }
  logoImg = new Image();
  await new Promise((res, rej) => { logoImg.onload = res; logoImg.onerror = rej; logoImg.src = '/scripts/preview-images/logo-white.png'; });
}

/* text: physical alignment, centre of the line at y. ar picks the Arabic font; num forces Latin */
function text(ctx, s, x, y, o) {
  const w = o.weight || 500;
  const fam = o.num ? 'Manrope' : (o.ar ? 'Cairo, Manrope' : 'Manrope, Cairo');
  const wt = o.num ? w : (o.ar ? (w >= 700 ? 700 : 500) : w);
  ctx.font = wt + ' ' + o.size + 'px ' + fam;
  ctx.fillStyle = o.color; ctx.textAlign = o.align || 'left'; ctx.textBaseline = 'middle';
  ctx.letterSpacing = (o.ls || 0) + 'px';
  ctx.direction = o.ar && !o.num ? 'rtl' : 'ltr';
  ctx.fillText(s, x, y);
  ctx.letterSpacing = '0px';
}
function measure(ctx, s, o) {
  const w = o.weight || 500;
  const fam = o.num ? 'Manrope' : (o.ar ? 'Cairo, Manrope' : 'Manrope, Cairo');
  const wt = o.num ? w : (o.ar ? (w >= 700 ? 700 : 500) : w);
  ctx.font = wt + ' ' + o.size + 'px ' + fam;
  ctx.letterSpacing = (o.ls || 0) + 'px'; ctx.direction = o.ar && !o.num ? 'rtl' : 'ltr';
  const m = ctx.measureText(s).width; ctx.letterSpacing = '0px'; return m;
}
function rr(ctx, x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

/* the P&L sheet behind the main card: the planner's Spreadsheet view, zoomed far out */
function sheet(ctx, t, ar) {
  const Wd = 602, LAB = 132, MC = 34, YR = 62;
  const rows = [
    ['sec', t.secRev], ['line', t.rev[0], R1], ['line', t.rev[1], R2], ['line', t.rev[2], R3], ['tot', t.totRev, R], ['gap'],
    ['sec', t.secCost], ['line', t.cost[0], X1], ['line', t.cost[1], X2], ['line', t.cost[2], X3], ['line', t.cost[3], X4],
    ['tot', t.totCost, X], ['gap'], ['net', t.netRow, N]
  ];
  const HT = { sec: 24, line: 24, tot: 26, gap: 10, net: 28 };
  const bodyH = rows.reduce((s, r) => s + HT[r[0]], 0), Ht = 38 + bodyH;
  ctx.save();
  rr(ctx, 0, 0, Wd, Ht, 18); ctx.fillStyle = '#FBFBFE'; ctx.fill(); ctx.clip();
  /* the columns keep the planner's own order: in Arabic the label sits at the right and the months run leftwards */
  const colX = (i) => (ar ? Wd - LAB - MC * (i + 0.5) : LAB + MC * (i + 0.5));
  const yrX = ar ? YR / 2 : Wd - YR / 2;
  const labX = ar ? Wd - 12 : 12, labAlign = ar ? 'right' : 'left';
  ctx.fillStyle = '#EEEEF8'; ctx.fillRect(0, 0, Wd, 38);
  for (let i = 0; i < 12; i++) text(ctx, ar ? t.months[i] : t.months[i].toUpperCase(), colX(i), 19, { size: 10, weight: 500, color: '#8E8EA6', align: 'center', ls: ar ? 0 : 1, ar });
  text(ctx, t.year, yrX, 19, { size: 10, weight: 500, color: '#8E8EA6', align: 'center', ls: ar ? 0 : 1, ar });
  let y = 38;
  for (const r of rows) {
    const k = r[0], h = HT[k];
    if (k === 'net') { ctx.fillStyle = '#E9F5EF'; ctx.fillRect(0, y, Wd, h); }
    if (k === 'line') { ctx.fillStyle = '#F0F0F7'; ctx.fillRect(0, y + h - 1, Wd, 1); }
    if (k !== 'gap') {
      const col = k === 'tot' ? INK : SOFT;
      const lab = k === 'sec' ? (ar ? r[1] : r[1].toUpperCase()) : r[1];
      text(ctx, lab, labX, y + h / 2, { size: 11, weight: 500, color: k === 'sec' ? INDIGO : col, align: labAlign, ls: k === 'sec' && !ar ? 1 : 0, ar });
      if (r[2]) {
        const v = r[2];
        for (let i = 0; i < 12; i++) text(ctx, k === 'net' ? signed(v[i]) : compact(v[i]), colX(i), y + h / 2, { size: 11, weight: 500, num: true, align: 'center', color: k === 'net' ? (v[i] >= 0 ? GREEN : RED) : col });
        const tot = total(v);
        text(ctx, k === 'net' ? signed(tot) : compact(tot), yrX, y + h / 2, { size: 11, weight: 500, num: true, align: 'center', color: k === 'net' ? (tot >= 0 ? GREEN : RED) : col });
      }
    }
    y += h;
  }
  ctx.restore();
  return Ht;
}

/* the main card: year totals and the monthly profit bars. In Arabic it mirrors */
function mainCard(ctx, t, ar) {
  const Wd = 440, PAD = 34;
  const L = ar ? Wd - PAD : PAD, Rr = ar ? PAD : Wd - PAD;       // "start" and "end" edges
  const startAlign = ar ? 'right' : 'left', endAlign = ar ? 'left' : 'right';
  const ls = ar ? 0 : 1.5;
  const rev = total(R), cost = total(X), net = total(N);
  const Ht = 447;
  rr(ctx, 0, 0, Wd, Ht, 30); ctx.fillStyle = '#FFFFFF'; ctx.fill();
  /* header */
  text(ctx, t.yearOne, L, 44, { size: 20, weight: 800, color: INDIGO, align: startAlign, ls: ar ? 0 : 3, ar });
  text(ctx, t.tag, Rr, 44, { size: 20, weight: 500, color: GREY, align: endAlign, ls: ar ? 0 : 2, ar });
  /* revenue and costs */
  text(ctx, t.revenue, L, 88, { size: 20, weight: 500, color: GREY, align: startAlign, ls, ar });
  text(ctx, compact(rev), L, 125, { size: 38, weight: 800, color: INK, align: startAlign, num: true });
  text(ctx, t.costs, Rr, 88, { size: 20, weight: 500, color: GREY, align: endAlign, ls, ar });
  text(ctx, compact(cost), Rr, 125, { size: 38, weight: 800, color: INK, align: endAlign, num: true });
  ctx.fillStyle = LINE; ctx.fillRect(PAD, 170, Wd - PAD * 2, 1);
  /* net profit */
  text(ctx, t.net, L, 201, { size: 20, weight: 500, color: GREY, align: startAlign, ls, ar });
  const nv = signed(net), nvw = measure(ctx, nv, { size: 72, weight: 800, num: true, ls: -2 });
  text(ctx, nv, L, 258, { size: 72, weight: 800, color: net >= 0 ? GREEN : RED, align: startAlign, num: true, ls: -2 });
  const pct = Math.round(net / rev * 100) + '%', pw = measure(ctx, pct, { size: 24, weight: 800, num: true }) + 32;
  const px = ar ? L - nvw - 18 - pw : L + nvw + 18;
  rr(ctx, px, 258 - 20.4, pw, 40.8, 20.4); ctx.fillStyle = net >= 0 ? '#E6F3ED' : '#FBEBED'; ctx.fill();
  text(ctx, pct, px + pw / 2, 258, { size: 24, weight: 800, color: net >= 0 ? GREEN : RED, align: 'center', num: true });
  /* twelve bars, one per month's profit */
  const top = 319.4, half = 46, bw = 24, gap = (Wd - PAD * 2 - bw * 12) / 11, mx = Math.max(...N.map(Math.abs));
  for (let i = 0; i < 12; i++) {
    const j = ar ? 11 - i : i, x = PAD + j * (bw + gap), v = N[i], len = Math.max(4, Math.round(Math.abs(v) / mx * half));
    ctx.fillStyle = LINE; ctx.fillRect(x, top + half, bw, 4);
    ctx.fillStyle = v >= 0 ? GREEN : RED;
    const rad = Math.min(6, len / 2);
    if (v >= 0) rr(ctx, x, top + half - len, bw, len, rad); else rr(ctx, x, top + half + 4, bw, len, rad);
    ctx.fill();
  }
  return Ht;
}

function drawCard(ctx, x, y, deg, shadow, drawFn) {
  /* measure first (draw off-screen) to rotate about the card's centre */
  const probe = document.createElement('canvas').getContext('2d');
  const h = drawFn(probe);
  const w = drawFn.w;
  ctx.save();
  ctx.translate(x + w / 2, y + h / 2); ctx.rotate(deg * Math.PI / 180); ctx.translate(-w / 2, -h / 2);
  ctx.shadowColor = shadow.c; ctx.shadowBlur = shadow.b; ctx.shadowOffsetY = shadow.y;
  /* the shadow is cast by a plain rounded shape, then the real card is drawn over it */
  rr(ctx, 0, 0, w, h, drawFn.r); ctx.fillStyle = '#fff'; ctx.fill();
  ctx.shadowColor = 'transparent';
  drawFn(ctx);
  ctx.restore();
}

function render(kind, lang) {
  const ar = lang === 'ar', t = S[lang], tool = kind === 'tool';
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  /* background: 135deg gradient */
  const g = ctx.createLinearGradient(142.5, -142.5, 1057.5, 772.5);
  g.addColorStop(0, DEEP); g.addColorStop(0.58, INDIGO); g.addColorStop(1, '#5B59E6');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  /* the cards: on the right (English) or the left (Arabic) */
  const x0 = ar ? 0 : 600;
  const sheetFn = (c) => sheet(c, t, ar); sheetFn.w = 602; sheetFn.r = 18;
  const mainFn = (c) => mainCard(c, t, ar); mainFn.w = 440; mainFn.r = 30;
  drawCard(ctx, ar ? x0 + 600 - 6 - 602 : x0 + 6, 30, ar ? -2 : 2, { c: 'rgba(10,10,60,0.30)', b: 60, y: 24 }, sheetFn);
  drawCard(ctx, ar ? x0 + 600 - 24 - 440 : x0 + 24, 76, ar ? 3 : -3, { c: 'rgba(16,16,40,0.35)', b: 70, y: 30 }, mainFn);

  /* the text column */
  const edge = ar ? 1132 : 68, align = ar ? 'right' : 'left';
  const lines = tool ? t.toolTitle : t.planTitle;
  let size = ar ? 70 : 76;
  while (Math.max(...lines.map((l) => measure(ctx, l, { size, weight: 800, ar, ls: ar ? 0 : -2 }))) > 520) size -= 2;
  const lh = size * 1.06, midH = lines.length * lh;
  const topH = tool ? 34 : 1, botH = tool ? 28.8 : 22;
  const midY = 64 + topH + (502 - topH - midH - botH) / 2;
  lines.forEach((l, i) => text(ctx, l, edge, midY + lh * i + lh / 2, { size, weight: 800, color: '#fff', align, ls: ar ? 0 : -2, ar }));
  const LW = 34 * (logoImg.width / logoImg.height);
  if (tool) {
    ctx.drawImage(logoImg, ar ? edge - LW : edge, 64, LW, 34);
    text(ctx, t.toolSub, edge, 566 - 14.4, { size: 24, weight: 500, color: '#DCDBF7', align, ar });
  } else {
    const lw = 22 * (logoImg.width / logoImg.height), tw = measure(ctx, t.built, { size: 18, weight: 500, ar });
    const cy = 566 - 11;
    text(ctx, t.built, edge, cy, { size: 18, weight: 500, color: '#C9C8F2', align, ar });
    ctx.drawImage(logoImg, ar ? edge - tw - 12 - lw : edge + tw + 12, cy - 11, lw, 22);
  }
  return cv;
}

(async () => {
  await loadAssets();
  const out = document.getElementById('out');
  const log = [];
  for (const [kind, lang] of [['tool', 'en'], ['tool', 'ar'], ['plan', 'en'], ['plan', 'ar']]) {
    const cv = render(kind, lang);
    const url = cv.toDataURL('image/jpeg', 0.92);
    const img = new Image(); img.src = url; img.style.cssText = 'width:600px;margin:6px'; out.appendChild(img);
    try {
      const r = await fetch('http://127.0.0.1:8766/' + kind + '-' + lang + '.jpg', { method: 'POST', body: url });
      log.push(await r.text());
    } catch (e) { log.push(kind + '-' + lang + ': not saved (is receive.py running?)'); }
  }
  document.querySelector('p').textContent = 'done — ' + log.join(' | ');
  document.title = 'done';
})();
</script>
